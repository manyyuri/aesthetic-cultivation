daily:
  minute_budget: 20
  items: 3
  domain_mix: [art, music, ballet]
  hook_max_chars: 60
weekly:
  minute_budget: 60
  items: 6
  domain_mix: [art, art, music, music, ballet, ballet]
  extras: [essay, revisit]
